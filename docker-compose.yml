services:
  postgres:
    image: postgres:16
    container_name: vietreport_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-E-commerce}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-vietreport_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      VIETREPORT_READER_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vietreport_admin -d E-commerce"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
